h1{margin:8px 16px 0;font-weight:400;font-size:clamp(26px,5.2vw,68px);line-height:1;color:#000;-webkit-text-stroke:7px #fff;paint-order:stroke fill;letter-spacing:2px}
.app{display:grid;grid-template-columns:minmax(220px,280px) minmax(0,1fr) minmax(0,1.1fr);gap:20px;padding:14px 16px 48px;align-items:start}
.box{min-width:0;border:1px solid #fff;background:rgba(0,0,0,.14);padding:8px}
#drop{display:block;border:1px solid #fff;cursor:pointer;margin-bottom:12px}#drop img,.hd img{display:block;width:100%}#drop.hot{background:rgba(255,255,255,.2)}
#list{height:min(62vh,520px);overflow:auto}
#list:empty::before,#anims:empty::before{content:"Nothing here yet";color:var(--mut);font-size:15px}
.hd{width:min(100%,360px);margin-bottom:8px}
.row{display:flex;gap:6px;align-items:center;padding:4px;border:1px solid transparent;cursor:pointer;font-size:13px}
.row span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row small{color:var(--mut)}
.on{border-color:#fff!important;background:rgba(255,255,255,.1)}
button{font:inherit;color:#fff;background:#2f3040;border:1px solid #fff;padding:3px 8px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid #ffd84a;outline-offset:1px}
.card{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:6px;margin-bottom:6px;border:1px solid transparent}
.card label:nth-child(-n+2){grid-column:span 2}
label{display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--mut)}
label.ck{flex-direction:row;align-items:center;align-self:end;gap:4px}
input{font:14px/1.2 system-ui,sans-serif;color:#fff;background:#2f3040;border:1px solid #ffffff80;padding:4px;width:100%;min-width:0}
input[type=checkbox]{width:auto}input[type=color]{padding:0;height:28px}
#set{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}.tabs .on{background:#fff;color:#000}
.stage{height:min(46vh,380px);padding:8px}
#cv{display:block;width:100%;height:100%;object-fit:contain;image-rendering:pixelated;background:repeating-conic-gradient(#555 0 25%,#666 0 50%) 0 0/16px 16px}
#strip{display:flex;width:100%;min-width:0;gap:4px;overflow-x:auto;padding:6px 0;font-size:10px}
#strip div{text-align:center;border:1px solid transparent;flex:none}#strip .cur{border-color:#fff}
.dlrow{margin-top:12px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.dlrow button{font-size:22px;padding:10px 20px}
#cr{position:fixed;right:8px;bottom:calc(6px + env(safe-area-inset-bottom,0px));font-size:10px;opacity:.55}
section{min-width:0}#anims{max-height:min(46vh,400px);overflow:auto}.box.off .stage,.box.off #strip{display:none}select{font:14px system-ui,sans-serif;color:#fff;background:#2f3040;border:1px solid #ffffff80;padding:4px;width:100%}@media(max-width:900px){.app{grid-template-columns:1fr}}
